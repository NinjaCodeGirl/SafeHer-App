<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeHer MVP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h1>🛡️ SafeHer</h1>

<p>Trusted Contacts: 5</p>

</div>

<button id="sos">SOS</button>

<button>Safety Timer</button>
<button>Safe Zones</button>
<button>Nearby Help</button>
</div>

<div id="output"></div>
</div>
<script src="script.js"></script>
</body>
</html>
